<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelNorte - Contacto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header">
    <img src="img/logo.png" alt="Logo de Pixel Norte" width="120" height="120">
    <h1>PixelNorte</h1>
    <nav id="nav-principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="contacto">
      <h2>Contacto</h2>
      <p>¿Tenés un proyecto en mente? Escribinos y te respondemos en menos de 48 horas.</p>

      <form id="formulario-contacto" action="#" method="post">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono">
        </div>
        <div>
          <label for="servicio">Servicio de interés</label>
          <select id="servicio" name="servicio">
            <option value="sitio-institucional">Sitio institucional</option>
            <option value="tienda-online">Tienda online</option>
            <option value="rediseno">Rediseño web</option>
            <option value="mantenimiento">Mantenimiento mensual</option>
          </select>
        </div>

        <fieldset class="campo-ancho">
          <legend>¿Cómo preferís que te contactemos?</legend>
          <label for="pref-email">
            <input type="checkbox" id="pref-email" name="preferencia" value="email"> Email
          </label>
          <label for="pref-telefono">
            <input type="checkbox" id="pref-telefono" name="preferencia" value="telefono"> Teléfono
          </label>
          <label for="pref-whatsapp">
            <input type="checkbox" id="pref-whatsapp" name="preferencia" value="whatsapp"> WhatsApp
          </label>
        </fieldset>

        <div class="campo-ancho">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5"></textarea>
        </div>

        <div class="campo-ancho">
          <button type="submit">Enviar</button>
        </div>
      </form>
    </section>
  </main>

  <footer id="site-footer">
    <p>&copy; 2026 PixelNorte</p>
  </footer>
      </form>
    </section>
  </footer>
</body>
</html>
